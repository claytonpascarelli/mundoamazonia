<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 90" role="img" aria-label="Mundo Amazônia">
  <title>Mundo Amazônia</title>

  <!-- MUNDO -->
  <text x="0" y="38"
    font-family="'Montserrat','Arial Black',Impact,sans-serif"
    font-weight="900" font-size="36" fill="#111111" letter-spacing="-0.5">MUNDO</text>

  <!-- AMAZÔNIA -->
  <text x="0" y="78"
    font-family="'Montserrat','Arial Black',Impact,sans-serif"
    font-weight="900" font-size="36" fill="#111111" letter-spacing="-0.5">AMAZ&#xD4;NIA</text>

  <!-- .com -->
  <text x="188" y="90"
    font-family="'Montserrat',Arial,sans-serif"
    font-weight="700" font-size="16" fill="#408344">.com</text>

  <!-- === SÍMBOLO ORGÂNICO 3D ===
       Forma 1 (verde escuro): silhueta total — aparece como profundidade/borda esquerda
       Forma 2 (verde claro): face frontal — desloca para direita, expondo tira escura à esquerda
  -->

  <!-- Verde escuro — base completa (profundidade visível à esquerda) -->
  <path d="
    M 244 6
    C 260 0, 300 4, 306 28
    C 312 52, 298 78, 278 86
    C 262 92, 242 82, 242 66
    C 242 50, 256 44, 258 36
    C 260 28, 250 14, 244 6
    Z
  " fill="#226B2E"/>

  <!-- Verde claro — face frontal (deslocada à direita, mostra profundidade) -->
  <path d="
    M 260 4
    C 276 -2, 310 4, 314 28
    C 318 52, 302 78, 282 86
    C 268 92, 258 82, 260 66
    C 262 50, 276 44, 278 36
    C 280 28, 272 12, 260 4
    Z
  " fill="#3DB844"/>
</svg>
