<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 90" role="img" aria-label="Mundo Amazônia">
  <title>Mundo Amazônia</title>

  <!-- MUNDO -->
  <text x="0" y="38"
    font-family="'Montserrat','Arial Black',Impact,sans-serif"
    font-weight="900" font-size="36" fill="#111111" letter-spacing="-0.5">MUNDO</text>

  <!-- AMAZÔNIA -->
  <text x="0" y="78"
    font-family="'Montserrat','Arial Black',Impact,sans-serif"
    font-weight="900" font-size="36" fill="#111111" letter-spacing="-0.5">AMAZ&#xD4;NIA</text>

  <!-- .com -->
  <text x="188" y="90"
    font-family="'Montserrat',Arial,sans-serif"
    font-weight="700" font-size="16" fill="#408344">.com</text>

  <!--
    SÍMBOLO: folha amazônica 3D
    - Verde escuro = silhueta completa (fundo)
    - Verde claro  = face frontal com concavidade CENTRAL pronunciada
      A borda esquerda do verde claro:
        topo  → próxima à borda do escuro (pouco escuro visível)
        meio  → recua muito para a direita (escuro exposto no centro)
        base  → retorna para a esquerda (pouco escuro visível)
      Resultado: escuro aparece como "nervura" central da folha 3D
  -->

  <!-- Verde escuro: silhueta completa da folha -->
  <path d="
    M 248 4
    C 266 -2, 314 7, 316 38
    C 318 66, 300 87, 280 89
    C 262 92, 238 80, 238 60
    C 238 42, 252 30, 254 18
    C 256 8, 250 6, 248 4
    Z
  " fill="#1D6B28"/>

  <!-- Verde claro: face frontal com concavidade CENTRAL profunda
       Borda esquerda sai perto do escuro no topo e na base,
       mas recua MUITO para a direita no centro → nervura/dobra da folha
  -->
  <path d="
    M 253 4
    C 270 -2, 314 7, 316 38
    C 318 66, 300 87, 280 89
    C 266 92, 252 80, 252 64
    C 251 52, 282 42, 284 36
    C 286 24, 270 10, 253 4
    Z
  " fill="#3DB844"/>
</svg>
